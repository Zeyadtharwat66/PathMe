spring.config.import=optional:file:.env[.properties]

server.port=8080
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:zeyad}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

app.base-url=${APP_BASE_URL}
app.frontend.url=${FRONTEND_URL}

app.password-reset.expiration-minutes=15

resend.api-key=${RESEND_API_KEY:}
resend.from=PathMe <onboarding@resend.dev>

spring.security.user.name=${SECURITY_USER_NAME:zeyad}
spring.security.user.password=${SECURITY_USER_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=zeyad-tharwat
app.jwt.exp-minutes=120

app.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.file.storage-location=uploads/courses

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB