# Server
server.port=8080
server.address=127.0.0.1

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# H2 disabled
spring.h2.console.enabled=false

# Application URLs
app.base-url=${APP_BASE_URL}
app.frontend.url=${FRONTEND_URL}

# Password Reset
app.password-reset.expiration-minutes=15

# Resend
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=zeyad-tharwat
app.jwt.exp-minutes=120

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# File Storage
app.file.storage-location=/var/lib/pathme/uploads/courses

# Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.cookie.secure=true
server.forward-headers-strategy=framework